[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-engine"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.0",
    "httpx==0.27.0",
    "pydantic==2.9.2",
    "PyYAML==6.0.0",
    "PyJWT==2.8.0",
    "cryptography==43.0.1",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.13",
    "pgvector==0.3.5"
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "pytest-asyncio==0.24.0", "httpx==0.27.2"]